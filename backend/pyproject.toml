[project]
name = "dataset-factory"
version = "0.1.0"
description = "Dataset Factory backend: AI labeling engine for LoRA training datasets"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "fastapi>=0.141.1",
    "filelock>=3.32.6",
    "openai>=3.13.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
dsf = "dataset_factory.cli:app"

[project.urls]
Repository = "https://github.com/The-Daybreaker/dataset-factory"
Issues = "https://github.com/The-Daybreaker/dataset-factory/issues"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.23",
    "detect-secrets>=1.5.0",
    "httpx>=0.28",
    "import-linter>=2.15",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mutmut>=3.4",
    "pre-commit>=4.6.2",
    "pyright>=1.1.413",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8",
    "ruff>=0.16.6",
    "types-pyyaml>=6.0.12.20260906",
    "vulture>=2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    # L3 真端点测试：依赖真实模型服务与密钥，慢且外部依赖不可控——
    # 不进日常 CI（CI 环境没有密钥，会自动跳过）；本地跑：uv run pytest -m live
    "live: 需要真实模型端点与密钥的 L3 测试（本地手动触发，不进 CI）",
]
# tmp 目录即用即删（none）：不留跨轮次垃圾，避免下一次运行启动时的批量清理
# 在受限环境下（rmtree 有单次删除上限）被拦；单个测试的 tmp 目录远小于上限。
tmp_path_retention_policy = "none"
tmp_path_retention_count = 0

[tool.coverage.run]
source = ["dataset_factory"]

[tool.coverage.report]
show_missing = true
# 硬门槛不在整包：核心五模块 ≥80%、入口层 cli/api 各 ≥70%（2026-09-12 设立）由 CI 的 coverage report --include 单独卡（goal B3）。

[tool.importlinter]
root_packages = ["dataset_factory"]

[[tool.importlinter.contracts]]
name = "分层：cli（启动器）> api（HTTP 入口）> runs（跑批编排）> labeling（单张打标）> 策略 > 工作目录 > 能力 > 数据域（单向；核心禁止 import 入口层）"
type = "layers"
layers = [
    "dataset_factory.cli",
    "dataset_factory.api",
    "dataset_factory.runs",
    "dataset_factory.labeling",
    "dataset_factory.strategies",
    "dataset_factory.export",
    "dataset_factory.workdir",
    "dataset_factory.llm",
    "dataset_factory.prompts | dataset_factory.skills | dataset_factory.sessions | dataset_factory.tasks",
]

[[tool.importlinter.contracts]]
name = "llm 保持纯净：不依赖任何功能模块"
type = "forbidden"
source_modules = ["dataset_factory.llm"]
forbidden_modules = [
    "dataset_factory.labeling",
    "dataset_factory.prompts",
    "dataset_factory.skills",
    "dataset_factory.sessions",
]

[[tool.importlinter.contracts]]
name = "数据域同层互相独立"
type = "independence"
modules = [
    "dataset_factory.prompts",
    "dataset_factory.skills",
    "dataset_factory.sessions",
]

# --- ruff：lint + 格式化（代码规范）---
# lint 只选非格式化类规则（E4/E7/E9 而非全 E），格式化交给 ruff format，避免两者打架。
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PT", "N", "RUF", "D", "TRY", "BLE", "S"]
ignore = [
    "D400", "D415",   # 首行句末标点：中文用「。」，英文句号规则误报
    "D401", "D403",   # 祈使语气 / 首词大写：英文语法检测，对中文不适用
    "D417",           # 不强制每个参数都写进 Args（简单函数一行 docstring 即可）
    "D105",           # 魔术方法（如 __repr__）免 docstring
    "RUF001", "RUF002", "RUF003",  # 全角中文标点被判「易混 Unicode」，中文项目误报
    "TRY003",         # 允许把可操作的长中文错误消息写在 raise 处（PRD 验收 12「哪里错怎么修」）
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]   # 骨架包暂无 docstring，各模块有内容时再补
"src/dataset_factory/api/routes_strategies.py" = ["N803"]  # 路径参数 sN 是 design 定的批次标识词汇（s1、s2…）
"src/dataset_factory/api/routes_runs.py" = ["N803"]  # 同上（跑批端点挂在批次路径之下）
"src/dataset_factory/api/routes_items.py" = ["N803"]  # 同上（条目视图与产物端点挂在批次路径之下）
"tests/**" = [
    "S101",   # 测试就是用 assert 断言
    "S105", "S106", "S107",  # 测试里的假密钥字面量（"test-key" 等），非真实凭据
]

[tool.ruff.lint.isort]
known-first-party = ["dataset_factory"]

# --- pyright：strict 静态类型检查（新项目尽早从严）---
[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# --- mutmut：L5 定向变异度量的目标范围（非门禁，只在 .github/workflows/mutation-metrics.yml
#     手工触发时用到；mutmut 不在项目依赖里，工作流用 uv --with 临时装）---
# 只变异本轮重构真正改动过的模块：变异一个模块要把它的可达测试重跑一遍，全仓跑的成本不可控
# （goal L5 定的口径就是「只对改动模块跑，不全仓跑」）。后续批次改到别的模块时往这里补。
[tool.mutmut]
source_paths = [
    "src/dataset_factory/_fs.py",
    "src/dataset_factory/_clock.py",
    "src/dataset_factory/api/app.py",
    "src/dataset_factory/api/problems.py",
    "src/dataset_factory/api/deps.py",
    "src/dataset_factory/cli/operations.py",
]
# 首跑在统计采集阶段抛 BadTestExecutionCommandsException（pytest 非 0 退出），但 mutmut 默认不打印
# pytest 的报错正文；开 debug 让下一次手工 dispatch 能把真实原因写进日志（度量件专用，不影响门禁）。
debug = true
