# Dependabot —— 自动盯着依赖，有安全漏洞或新版本就开 PR 帮你升级（公开仓免费）。
# 签入默认分支 main 的 .github/dependabot.yml 后生效；directory 相对仓库根。
version: 2
updates:
  # Python 依赖：uv 生态会同时更新 backend/pyproject.toml 与 uv.lock，
  # 保证 CI 的 `uv sync --frozen` 不会因为只改了 pyproject 没重锁而失败。
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # CI 用的 GitHub Actions 版本（actions/checkout、astral-sh/setup-uv 等）。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
