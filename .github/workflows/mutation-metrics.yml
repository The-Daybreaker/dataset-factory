# 变异度量（非门禁，手工触发）——goal L5「测试到底有没有用」的量化件。
#
# 为什么单开一个 workflow、且不挂进 CI：
#   - mutmut 官方要求 Windows 走 WSL（本机没有发行版，实测见 process/review-refactor.md 第三节），
#     只能在 Linux runner 上跑；
#   - 变异测试是**度量**不是**门禁**：它慢（按 mutants 数逐个重跑测试），且存活变异体需要人
#     逐条判读，把它挂成红/绿闸门只会逼人删断言或加豁免——正是要避免的那种「变绿的省事手段」。
# 跑法：Actions → 变异度量 → Run workflow，或 `gh workflow run mutation-metrics.yml`。
# 结果不进徽章，只写进步骤摘要（process/review-refactor.md 的 B6 行抄这个数）。

name: 变异度量（非门禁）

on:
  workflow_dispatch:        # 只手工触发：这是度量件，不参与 push / PR 的红绿判定

permissions:
  contents: read            # 只读代码与测试，不写回仓库

env:
  PYTHONUTF8: 1

jobs:
  backend-mutation:
    name: "backend mutation (mutmut)"
    runs-on: ubuntu-latest
    timeout-minutes: 90         # 成本控制：超时就停下，已有结果仍会写进摘要
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv (+ Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen

      # mutmut 只在度量时用，不进项目依赖（本轮「依赖只减不增」）：--with 装进临时环境。
      # 先把 CLI 与配置读取结果打进日志：目标范围写在 backend/pyproject.toml [tool.mutmut]，
      # 键名对不对看这一步就知道（本地 Windows 跑不了 mutmut，只能在这里验）。
      - name: Show mutmut CLI (diagnostics)
        run: |
          uv run --with mutmut mutmut --version
          uv run --with mutmut mutmut run --help

      - name: Run mutation (targeted modules only)
        run: uv run --with mutmut mutmut run

      - name: Export stats
        if: always()
        run: |
          uv run --with mutmut mutmut export-cicd-stats
          # 数字同时进日志：步骤摘要只渲染在网页上、gh 取不到，日志才可被脚本读回。
          cat mutants/mutmut-cicd-stats.json

      - name: Write summary to step output
        if: always()
        run: |
          score() {
            if [ -f mutants/mutmut-cicd-stats.json ]; then
              jq -r '"total=\(.total)  tested=\(.total - .skipped)  killed=\(.killed + .timeout + .suspicious)  (killed=\(.killed) timeout=\(.timeout) suspicious=\(.suspicious))",
                     "survived=\(.survived)  no_tests=\(.no_tests)  segfault=\(.segfault)  skipped=\(.skipped)",
                     (if (.total - .skipped) > 0 then
                        "击杀率（保守口径：segfault 记未杀）= \( (((.killed + .timeout + .suspicious) * 1000 / (.total - .skipped)) | round) / 10 )%"
                      else "击杀率（保守口径）= n/a（无可测变异体）" end),
                     (if (.total - .skipped - .segfault) > 0 then
                        "击杀率（排除 segfault 分母）= \( (((.killed + .timeout + .suspicious) * 1000 / (.total - .skipped - .segfault)) | round) / 10 )%"
                      else "击杀率（排除 segfault 分母）= n/a" end)' \
                mutants/mutmut-cicd-stats.json
            else
              echo "没有 stats 文件（变异阶段未跑完或未开始）"
            fi
          }
          # `mutmut results` 默认只列**未击杀**的变异体（`--all` 才连 killed 一起列，
          # 且它是需要取值的选项、写成裸 `--all` 会直接报错）。这里只要可行动的两类：
          # survived（有用例跑到却没杀）与 "no tests"（覆盖空洞；mutmut 的状态标签里
          # no_tests 这个键在 results 里写作带空格的 "no tests"）；segfault 属工具/环境噪声，
          # 只在计数里出现，逐条列出来只会淹没前两类。
          uncleared() {
            uv run --with mutmut mutmut results 2>&1 \
              | grep -E ': (survived|no tests)$' \
              | sed 's/^ *//' \
              | sort
          }
          uncleared > uncleared-mutants.txt || true
          {
            echo "## 变异击杀率（本轮改动模块）"
            echo
            echo '```'
            score
            echo '```'
            echo
            echo '`no_tests` = 没有任何用例会跑到的变异体数（覆盖空洞），不计入击杀率分子。'
            echo '`segfault` = 子进程崩溃的变异体数（mutmut 在 pytest 崩溃时的分类），两个口径都列出来供对照。'
            echo
            echo "### 未击杀清单（共 $(wc -l < uncleared-mutants.txt) 条，全量也在作业日志里）"
            echo
            echo '```'
            cat uncleared-mutants.txt
            echo '```'
            echo
            echo "### 按模块聚合（键形如 `包.模块.函数__mutmut_N`，去掉最后一段即模块）"
            echo
            echo '```'
            sed 's/:[a-z ]*$//; s/\.[^.]*$//' uncleared-mutants.txt | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          score
          echo "--- uncleared mutants ($(wc -l < uncleared-mutants.txt)) ---"
          cat uncleared-mutants.txt

      # 逐条差异才是能动手的信息：只有名字看不出「哪个常量没被断言」。这一步把未击杀变异体
      # 的 diff 全量打进日志（约 200 条 × 十几行），下一轮照它补用例时不必再猜改了什么。
      # continue-on-error：这是取数附赠品，它失败不该把整个度量作业标红。
      - name: Dump uncleared mutant diffs
        if: always()
        continue-on-error: true
        run: |
          sed 's/: [a-z ]*$//' uncleared-mutants.txt | sort | head -240 > uncleared-names.txt
          echo "取到 $(wc -l < uncleared-names.txt) 个未击杀变异体的差异"
          while read -r name; do
            echo "===== ${name}"
            uv run --with mutmut mutmut show "${name}" 2>&1 | sed -n '1,30p'
          done < uncleared-names.txt
