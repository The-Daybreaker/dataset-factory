# 变异度量（非门禁，手工触发）——goal L5「测试到底有没有用」的量化件。
#
# 为什么单开一个 workflow、且不挂进 CI：
#   - mutmut 官方要求 Windows 走 WSL（本机没有发行版，实测见 process/review-refactor.md 第三节），
#     只能在 Linux runner 上跑；
#   - 变异测试是**度量**不是**门禁**：它慢（按 mutants 数逐个重跑测试），且存活变异体需要人
#     逐条判读，把它挂成红/绿闸门只会逼人删断言或加豁免——正是要避免的那种「变绿的省事手段」。
# 跑法：Actions → 变异度量 → Run workflow，或 `gh workflow run mutation-metrics.yml`。
# 结果不进徽章，只写进步骤摘要（process/review-refactor.md 的 B6 行抄这个数）。

name: 变异度量（非门禁）

on:
  workflow_dispatch:        # 只手工触发：这是度量件，不参与 push / PR 的红绿判定

permissions:
  contents: read            # 只读代码与测试，不写回仓库

env:
  PYTHONUTF8: 1

jobs:
  backend-mutation:
    name: "backend mutation (mutmut)"
    runs-on: ubuntu-latest
    timeout-minutes: 90         # 成本控制：超时就停下，已有结果仍会写进摘要
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv (+ Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen

      # mutmut 只在度量时用，不进项目依赖（本轮「依赖只减不增」）：--with 装进临时环境。
      # 先把 CLI 与配置读取结果打进日志：目标范围写在 backend/pyproject.toml [tool.mutmut]，
      # 键名对不对看这一步就知道（本地 Windows 跑不了 mutmut，只能在这里验）。
      - name: Show mutmut CLI (diagnostics)
        run: |
          uv run --with mutmut mutmut --version
          uv run --with mutmut mutmut run --help

      - name: Run mutation (targeted modules only)
        run: uv run --with mutmut mutmut run

      - name: Export stats
        if: always()
        run: uv run --with mutmut mutmut export_cicd_stats

      - name: Write summary to step output
        if: always()
        run: |
          {
            echo "## 变异击杀率（本轮改动模块）"
            echo
            echo '```'
            if [ -f mutants/mutmut-cicd-stats.json ]; then
              jq -r '"total=\(.total)  tested=\(.total - .skipped)  killed=\(.killed + .timeout + .suspicious)  (killed=\(.killed) timeout=\(.timeout) suspicious=\(.suspicious))",
                     "survived=\(.survived)  no_tests=\(.no_tests)  skipped=\(.skipped)",
                     (if (.total - .skipped) > 0 then
                        "mutation score = \( (((.killed + .timeout + .suspicious) * 1000 / (.total - .skipped)) | round) / 10 )%"
                      else "mutation score = n/a（无可测变异体）" end)' \
                mutants/mutmut-cicd-stats.json
            else
              echo "没有 stats 文件（变异阶段未跑完或未开始）"
            fi
            echo '```'
            echo
            echo "`no_tests` = 没有任何用例会跑到的变异体数（覆盖空洞），不计入击杀率分子。"
            echo
            echo "### 变异体逐条结果（前 200 行）"
            echo
            echo '```'
            uv run --with mutmut mutmut results --all 2>&1 | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
