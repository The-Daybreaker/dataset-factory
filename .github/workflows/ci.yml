# GitHub Actions CI —— 持续集成流水线：
# 每次 push / PR，自动跑三套 job，全绿才算过：
#   - test（后端）：测试 + 覆盖率 + 架构契约 + ruff lint/format + pyright 类型 + pre-commit + OpenAPI 漂移检查 + docs 构建
#   - frontend（前端）：Biome lint/format + tsc 类型检查 + Vitest + Vite 构建
#   - api-contract：oasdiff 对比前后两次提交的 OpenAPI 快照，破坏性变更（ERR 级）直接挡下
# 注意：本文件本地跑不了，推到 GitHub 后才在它的 runner 上真正执行。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # 最小权限：这个 workflow 只需读代码，不给写权限（安全默认）

env:
  PYTHONUTF8: 1         # 强制 Python UTF-8 模式：Windows runner 默认 cp1252，中文输出（契约名 / docstring）会 UnicodeEncodeError

jobs:
  test:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false                            # 一个系统跑挂不取消另一个，两边结果都看得到
      matrix:
        os: [ubuntu-latest, windows-latest]       # 跨平台矩阵（Win + Linux 两系统各跑一遍）
    defaults:
      run:
        working-directory: backend                # uv 项目在 backend/ 子目录，run 步骤都在这里执行
    steps:
      - name: Checkout
        uses: actions/checkout@v7                 # 把仓库代码检出到 runner

      - name: Install uv (+ Python 3.12)
        uses: astral-sh/setup-uv@v7               # 官方 action：装 uv，并按需装 Python
        with:
          python-version: "3.12"
          enable-cache: true                      # 缓存 uv 下载，加速后续运行
          cache-dependency-glob: "backend/uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen                     # 按已入库的 uv.lock 装依赖（--frozen：锁文件不许改，改了说明没同步）

      - name: Pre-commit (repo hygiene)
        run: uv run pre-commit run --all-files   # 钩子清单见仓库根 .pre-commit-config.yaml

      - name: Test + coverage
        run: uv run pytest --cov=dataset_factory  # 跑测试 + 覆盖率（整体报告参考，不设硬门槛）

      - name: Core coverage gate (≥80%)
        run: >-                                   # 核心五模块（labeling/llm/prompts/skills/sessions）行覆盖率 ≥80% 才算过；入口层与整体不设硬门槛（goal B3）
          uv run coverage report
          --include="*/dataset_factory/labeling/*,*/dataset_factory/llm/*,*/dataset_factory/prompts/*,*/dataset_factory/skills/*,*/dataset_factory/sessions/*"
          --fail-under=80

      - name: Lint (ruff check)
        run: uv run ruff check .                  # 代码风格 + 低级错误检查（规则集见 pyproject [tool.ruff]）

      - name: Format check (ruff format)
        run: uv run ruff format --check .         # 格式一致性（只校验不改；本地用 ruff format 应用）

      - name: Type check (pyright strict)
        run: uv run pyright                       # 静态类型检查 strict（见 pyproject [tool.pyright]）

      - name: Import contracts (architecture)
        run: uv run lint-imports                  # 守分层依赖规则（核心库不反向依赖入口层、能力层不依赖功能模块等）

      - name: OpenAPI snapshot drift check (generate)
        run: uv run python scripts/export_openapi.py --output openapi.generated.json

      # 契约漂移检查：生成的 spec 必须与仓库快照一致；红了 = 改了 API 没重新导出
      # （修复办法：uv run python scripts/export_openapi.py，提交新快照）
      - name: OpenAPI snapshot drift check (compare)
        run: git diff --exit-code --no-index -- openapi.json openapi.generated.json

      - name: Cleanup generated spec
        if: always()
        run: uv run python -c "import pathlib; pathlib.Path('openapi.generated.json').unlink(missing_ok=True)"

      - name: Docs build (mkdocs --strict)
        run: uv run mkdocs build --strict         # 文档骨架构建（mkdocstrings 从 docstring 抽 API；--strict 把警告当错误）

  frontend:
    name: "frontend (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false                            # 与后端一致：一个系统挂不取消另一个
      matrix:
        os: [ubuntu-latest, windows-latest]       # 跨平台矩阵（与后端同规格）
    defaults:
      run:
        working-directory: frontend               # npm 工程在 frontend/ 子目录
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node (+ npm 缓存)
        uses: actions/setup-node@v7
        with:
          node-version: "22"                      # 与本地开发所用的大版本一致
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync dependencies
        run: npm ci                               # 按 package-lock.json 装（可复现，等价后端的 uv sync --frozen）

      - name: Lint (Biome)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run typecheck                    # 类型检查独立成步：Vite 构建只转译、不做类型检查

      - name: Test (Vitest)
        run: npm run test

      - name: Build (Vite)
        run: npm run build

  api-contract:
    name: "api-contract (breaking changes)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2                          # 需要 HEAD~1 上的旧快照作对比基线

      # 上一个提交没有快照时（仓库首个提交 / 新仓库），用空 spec 兜底：
      # 空 spec vs 新 spec 的差异全是「新增端点」，不算破坏性变更，不会误伤。
      - name: Prepare base spec
        run: git show HEAD~1:backend/openapi.json > /tmp/base.json 2>/dev/null || echo '{"openapi":"3.1.0","info":{"title":"empty baseline","version":"0.0.0"},"paths":{}}' > /tmp/base.json

      # API 破坏性变更检测：对比上一个提交与本次提交的契约快照（快照与代码的一致性
      # 由 backend job 的漂移检查保证，所以这里直接比两个提交的快照是可靠的）。
      # fail-on: ERR —— 只有真破坏性变更才挡；纯新增 / 可选字段放宽不挡。
      - name: Breaking change check (oasdiff)
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: /tmp/base.json
          revision: HEAD:backend/openapi.json
          fail-on: ERR
          review: false                           # spec 不上传第三方，只在本 runner 内比对
